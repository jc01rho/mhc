name: sync-upstream
# Merges Indosaram/mhc main into this repo's main every hour. A conflict fails the run (the failure mail is the alert).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: sync-upstream
jobs:
  sync:
    if: github.repository == 'jc01rho/mhc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "mhc-sync"
          git config user.email "mhc-sync@users.noreply.github.com"
          git remote add fork "https://x-access-token:${{ github.token }}@github.com/jc01rho/mhc.git" 
          git remote rename origin up_tmp
          git remote add origin https://github.com/Indosaram/mhc.git
          git remote remove up_tmp
          bash scripts/sync-upstream.sh "$PWD"

[package]
name = "maho-sync-server"
version.workspace = true
edition.workspace = true
license = "MIT"
publish.workspace = true
description = "Self-hostable memory-sync server for mhc (an open, dumb ciphertext log)"

[lib]
name = "maho_sync_server"
path = "src/lib.rs"

[[bin]]
name = "mhc-sync-server"
path = "src/main.rs"

[dependencies]
axum = "=0.8.9"
base64.workspace = true
futures.workspace = true
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "sync", "net", "time", "signal"] }

[dev-dependencies]
maho-memory-core.workspace = true
reqwest = { workspace = true, features = ["json"] }
tempfile.workspace = true
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "sync", "net", "time"] }

[lints]
workspace = true

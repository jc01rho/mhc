[package]
name = "maho-omo-computer-engine"
version.workspace = true
edition = "2021"
license = "MIT"

[[bin]]
name = "omo-computer-engine"
path = "src/main.rs"

[dependencies]
omo-computer-core = { package = "maho-omo-computer-core", path = "../omo-computer-core" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
omo-computer-session = { package = "maho-omo-computer-session", path = "../omo-computer-session" }
omo-computer-backend-fake = { package = "maho-omo-computer-backend-fake", path = "../omo-computer-backend-fake" }
omo-computer-backend-atspi = { package = "maho-omo-computer-backend-atspi", path = "../omo-computer-backend-atspi" }
omo-computer-backend-macos = { package = "maho-omo-computer-backend-macos", path = "../omo-computer-backend-macos" }
omo-computer-backend-x11 = { package = "maho-omo-computer-backend-x11", path = "../omo-computer-backend-x11" }
omo-computer-backend-wayland = { package = "maho-omo-computer-backend-wayland", path = "../omo-computer-backend-wayland" }
omo-computer-backend-win32 = { package = "maho-omo-computer-backend-win32", path = "../omo-computer-backend-win32" }

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"

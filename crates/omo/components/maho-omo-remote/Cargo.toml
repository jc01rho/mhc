[package]
name = "maho-omo-remote"
description = "Native port of omo's `omo remote` verbs and `omo login|whoami|logout` for mhc: status, devices, sessions, enable/disable, control, wake, bootstrap and the session verbs over the device service's local API v1, the mhc-relayd daemon entry with the rpc-host session host, and the /remote command."
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "LicenseRef-SUL-1.0"
autotests = false

[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
maho-core = { path = "../../../maho-core" }
maho-device-service-core = { path = "../../device-service-core" }
maho-ext-api = { path = "../../../maho-ext-api" }
maho-memory-core.workspace = true
maho-rpc = { path = "../../../maho-rpc" }
maho-service-endpoints = { path = "../../../maho-service-endpoints" }
maho-thread-address-core = { path = "../../thread-address-core" }
mhc-relayd = { path = "../../mhc-relayd" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

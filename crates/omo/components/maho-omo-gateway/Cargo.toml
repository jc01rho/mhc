[package]
name = "maho-omo-gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "LicenseRef-SUL-1.0"
autotests = false

[dependencies]
maho-ext-api = { path = "../../../maho-ext-api" }
maho-device-service-core = { path = "../../device-service-core" }
maho-core = { path = "../../../maho-core" }
maho-rpc = { path = "../../../maho-rpc" }
maho-omo-agent-home = { path = "../maho-omo-agent-home" }
maho-omo-call-budget = { path = "../../call-budget" }
maho-omo-config-resolution = { path = "../maho-omo-config-resolution" }
maho-omo-config-core = { path = "../../omo-config-core" }
maho-thread-address-core = { path = "../../thread-address-core" }
futures.workspace = true
regex.workspace = true
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror = "=2.0.20"
# The agentd client's link runs on its own current-thread runtime over TCP, so tokio is a real dependency here, not a
# test-only one; every feature listed is one the link, the follow stream or the `tokio::select!` in it uses.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
maho-ext-host = { path = "../../../maho-ext-host" }
maho-test-support = { path = "../../../maho-test-support", features = ["sdk"] }
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[package]
name = "maho-senpi-desktop-xpc"
version.workspace = true
edition = "2021"
license = "MIT"

[lib]
name = "senpi_desktop_xpc"

[dependencies]
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "=0.3.2"
block2 = "=0.6.2"
libc.workspace = true
flume = "=0.12.0"
parking_lot = "=0.12.5"
tokio = { workspace = true, features = ["io-util", "net", "process", "rt-multi-thread"] }
senpi-desktop-core = { package = "maho-senpi-desktop-core", path = "../senpi-desktop-core" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = "=0.6.2"
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
senpi-desktop-session = { package = "maho-senpi-desktop-session", path = "../senpi-desktop-session" }
senpi-desktop-safety = { package = "maho-senpi-desktop-safety", path = "../senpi-desktop-safety" }
senpi-desktop-backend-fake = { package = "maho-senpi-desktop-backend-fake", path = "../senpi-desktop-backend-fake" }

# Imported from oh-my-openagent (MIT). FFI modules allow unsafe locally (`#![allow(unsafe_code)]`)
# and every unsafe block carries a SAFETY comment.
[lints.rust]
unsafe_code = "deny"
